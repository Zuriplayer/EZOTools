name: EZO addon status

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type PUBLISH to send to Discord. Any other value runs a dry run only."
        required: true
        default: "DRY_RUN"
      note:
        description: Optional note for Discord
        required: false
        default: ""

jobs:
  publish-status:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Publish addon status to Discord
        shell: pwsh
        env:
          EZO_CODEX_STATUS: ${{ secrets.EZO_CODEX_STATUS }}
          CODEX_LOG: ${{ secrets.CODEX_LOG }}
          EZO_CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          EZO_STATUS_NOTE: ${{ inputs.note }}
        run: |
          $publish = "$env:EZO_CONFIRM_PUBLISH" -eq "PUBLISH"
          .\scripts\ezo\publish-status.ps1 -Note $env:EZO_STATUS_NOTE -PublishCodexLog -DryRun:(!$publish)
